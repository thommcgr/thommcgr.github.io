# Site settings
title: "Thomas McGregor's Resume"
description: "Resume of Thomas McGregor on GitHub Pages."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Thomas McGregor"
resume_title:                   "ICT System Administrator"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "thommcgr@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
#resume_contact_telephone:       "0"
resume_contact_address:         "Melbourne,Victoria"

resume_header_contact_info:     "Melbourne,Victoria • thommcgr@gmail.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>ICT System Administrator with a career spanning over a decade of technical excellence at nbn Co, IBM, and the Australian Public Service. I offer a unique blend of Advanced Network Engineering and Modern Systems Administration, with significant experience leading technical teams through high-impact incidents and large-scale migrations. I am experienced in Infrastructure-as-Code (PowerShell, PowerCLI, and Terraform), Endpoint Modernisation, and Cloud Security Governance, committed to delivering resilient and highly automated ICT services.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
# resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
# resume_section_links:           true
# resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/thommcgr"
  #resume_twitter_url:           "http://twitter.com/jglovier"
  #resume_dribbble_url:          "https://dribbble.com/jag"
  #resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/thommcgr"
  #resume_instagram_url:         "insert your Instagram URL here"
  #resume_website_url:           "http://joelglovier.com"
  #resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

